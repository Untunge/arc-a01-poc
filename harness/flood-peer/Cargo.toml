[package]
name = "flood-peer"
version = "0.1.0"
edition = "2021"
description = "Single non-validator libp2p peer that floods a malachite v0.8.0 node with gossipsub topic subscriptions (PoC A-01 vector (c), localnet only)"

[dependencies]
futures = "0.3"
libp2p = { version = "=0.56.0", features = ["tcp", "noise", "yamux", "tokio", "identify", "ping"] }
libp2p-gossipsub = "=0.49.4"
tokio = { version = "1", features = ["full"] }

[profile.release]
debug = false

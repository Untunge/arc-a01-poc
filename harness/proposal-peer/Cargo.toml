[package]
name = "proposal-peer"
version = "0.1.0"
edition = "2021"
description = "Single libp2p peer that sends far-future round proposals, signed as one Byzantine validator, to a malachite v0.8.0 node (PoC A-01 vector (a), localnet only)"

[dependencies]
async-trait = "0.1"
ed25519-consensus = "=2.1.0"
futures = "0.3"
libp2p = { version = "=0.56.0", features = ["tcp", "noise", "yamux", "tokio", "identify", "ping", "macros", "gossipsub", "request-response"] }
libp2p-gossipsub = "=0.49.4"
libp2p-scatter = "=0.3.0"
sha3 = "=0.10.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false

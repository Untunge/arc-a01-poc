# PoC gossipsub subscription flood — Arc A-01 vector (c) (#4229458) localnet
#
# Builds unmodified arc-node (pinned commit) on a GitHub-hosted runner,
# brings up a SINGLE node (1 CL + 1 EL, localhost only; no quorum needed),
# and connects a plain non-validator libp2p peer that subscribes to a large
# number of distinct gossipsub topics in stages (5k / 20k / 50k), measuring
# CL RSS growth and counting accepted subscriptions in the node log.
#
# Safety: localnet only (127.0.0.1), public code only (circlefin/arc-node),
# no mainnet/testnet traffic, nothing is submitted to HackerOne from here.
# The report is written by a human afterwards.
#
# Trigger manually: gh workflow run poc-gossipsub-flood.yml
# (No push/PR trigger on purpose — each run is a deliberate, heavy build.)

name: PoC gossipsub flood (Arc A-01 vector c)

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Comma-separated cumulative subscription levels"
        required: false
        default: "5000,20000,50000"
      rate:
        description: "Subscriptions per second"
        required: false
        default: "1000"

env:
  ARC_NODE_REF: 6e764023ee6515fe70573e123ed2db912a7207b4
  CARGO_BUILD_JOBS: 3
  CARGO_PROFILE_DEV_DEBUG: 0
  POC_DIR: ${{ github.workspace }}

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out PoC repo
        uses: actions/checkout@v4

      - name: Check out arc-node at pinned commit
        uses: actions/checkout@v4
        with:
          repository: circlefin/arc-node
          ref: ${{ env.ARC_NODE_REF }}
          path: arc-node

      - name: Record runner resources
        run: |
          df -h
          free -m
          nproc

      - name: Install system deps (libclang for bindgen/reth-mdbx-sys)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev pkg-config libssl-dev

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arc-node
          cache-all-crates: true
          cache-on-failure: true

      - name: Build EL + CL binaries
        working-directory: arc-node
        run: cargo build --locked -p arc-node-execution -p arc-node-consensus

      - name: Build flood-peer harness (libp2p 0.56.0 / gossipsub 0.49.4)
        run: cargo build --locked --release --manifest-path harness/flood-peer/Cargo.toml

      - name: Disk after build
        run: df -h

      - name: Set up 1-node localnet layout
        run: |
          bash scripts/net-setup.sh
          python3 scripts/gen_keys.py
          python3 scripts/verify-keys.py

      - name: Run PoC gossipsub flood
        run: bash scripts/run-flood.sh
        env:
          LEVELS: ${{ inputs.levels }}
          RATE: ${{ inputs.rate }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-gossipsub-flood-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-gossipsub-flood-node-logs
          path: net/node0/logs/*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload flood-peer Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-gossipsub-flood-lockfile
          path: harness/flood-peer/Cargo.lock
          retention-days: 30
          if-no-files-found: warn
